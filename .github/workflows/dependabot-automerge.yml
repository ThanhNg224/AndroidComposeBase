name: dependabot-automerge-eligibility

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

# Dependabot pull_request_target runs are restricted by GitHub to a read-only token
# with no secrets. This workflow uses only trusted default-branch workflow code.
permissions:
  contents: read
  pull-requests: read

jobs:
  eligibility:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Write bounded eligibility artifact
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          eligible=false
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              eligible=true
              ;;
          esac

          mkdir -p "$RUNNER_TEMP/dependabot-eligibility"
          jq -n \
            --arg eligible "$eligible" \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_head_sha "$PR_HEAD_SHA" \
            '{
              eligible: ($eligible == "true"),
              pull_request_number: ($pr_number | tonumber),
              pull_request_head_sha: $pr_head_sha
            }' > "$RUNNER_TEMP/dependabot-eligibility/eligibility.json"

      - name: Upload eligibility artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependabot-eligibility
          path: ${{ runner.temp }}/dependabot-eligibility/eligibility.json
          if-no-files-found: error
          retention-days: 1
