name: dependabot-automerge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Dependabot pull_request runs receive a read-only GITHUB_TOKEN. The merge token is
# supplied separately through the repository's Dependabot secrets store.
permissions:
  contents: read
  pull-requests: read

jobs:
  automerge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Allow patch and minor updates only
        id: eligibility
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              echo "Eligible Dependabot update: $UPDATE_TYPE"
              echo "eligible=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Skipping auto-merge for update type: ${UPDATE_TYPE:-unknown}"
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Require auto-merge, protected main, and configured tokens
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_READ_TOKEN }}
          AUTOMERGE_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "FAIL: configure Dependabot secret BRANCH_PROTECTION_READ_TOKEN with repository Administration:read." >&2
            exit 1
          fi
          if [[ -z "$AUTOMERGE_TOKEN" ]]; then
            echo "FAIL: configure Dependabot secret DEPENDABOT_AUTOMERGE_TOKEN with contents:write and pull-requests:write." >&2
            exit 1
          fi

          allow_auto_merge="$(gh api "repos/$REPOSITORY" --jq '.allow_auto_merge')"
          if [[ "$allow_auto_merge" != "true" ]]; then
            echo "FAIL: repository auto-merge is not enabled." >&2
            exit 1
          fi

          required_check="$(gh api "repos/$REPOSITORY/branches/main/protection" \
            --jq '((.required_status_checks.contexts // []) + [.required_status_checks.checks[]?.context]) | any(. == "check")')"
          if [[ "$required_check" != "true" ]]; then
            echo "FAIL: main branch protection must require the 'check' status." >&2
            exit 1
          fi

      - name: Enable auto-merge for Dependabot PR
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
